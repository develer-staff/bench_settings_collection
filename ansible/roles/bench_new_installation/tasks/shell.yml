---
- name: Load passwd database
  ansible.builtin.getent:
    database: passwd

- name: Build map of user to home directory
  ansible.builtin.set_fact:
    bench_user_homes: >-
      {{
        bench_user_homes | default({})
        | combine({item: ansible_facts.getent_passwd[item][4]})
      }}
  loop: "{{ bench_shell_users }}"
  when: item in ansible_facts.getent_passwd

- name: Copy develer_profile to user homes
  ansible.builtin.copy:
    src: "{{ bench_repo_root }}/conf/develer_profile"
    dest: "{{ bench_user_homes[item] }}/.develer_profile"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0644"
  loop: "{{ bench_shell_users }}"
  when: item in bench_user_homes

- name: Copy logo to user homes
  ansible.builtin.copy:
    src: "{{ bench_repo_root }}/conf/logo"
    dest: "{{ bench_user_homes[item] }}/.logo"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0644"
  loop: "{{ bench_shell_users }}"
  when: item in bench_user_homes

- name: Ensure .bash_profile sources develer_profile
  ansible.builtin.blockinfile:
    path: "{{ bench_user_homes[item] }}/.bash_profile"
    create: true
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK develer_profile"
    block: |
      if [ -f .develer_profile ]; then
          . ~/.develer_profile
      fi
  loop: "{{ bench_shell_users }}"
  when: item in bench_user_homes

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ bench_user_homes[item] }}/.local/bin"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0755"
  loop: "{{ bench_shell_users }}"
  when: item in bench_user_homes

- name: Check that bin/dboard exists in the repo
  ansible.builtin.stat:
    path: "{{ bench_repo_root }}/bin/dboard"
  register: dboard_src
  run_once: true
  delegate_to: localhost
  become: false

- name: Fail if bin/dboard is missing
  ansible.builtin.fail:
    msg: >-
      Missing {{ bench_repo_root }}/bin/dboard.
      Place the dboard binary in bin/ before running this playbook.
  when: not dboard_src.stat.exists
  run_once: true

- name: Install dboard into ~/.local/bin
  ansible.builtin.copy:
    src: "{{ bench_repo_root }}/bin/dboard"
    dest: "{{ bench_user_homes[item] }}/.local/bin/dboard"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0755"
  loop: "{{ bench_shell_users }}"
  when: item in bench_user_homes
