---
- name: Pull, patch, build, and publish Custom Fedora ISO image
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  vars:
    target_fedora_version: "44" # Note that the patch should be based on this Fedora version to be applied

    # Project paths
    project_dir: "{{ playbook_dir }}/.."
    kiwi_submodule_path: "{{ project_dir }}/kiwi-descriptions"
    patch_file_path: "{{ project_dir }}/conf/0001-Fedora-44-LXDE-Spin-kiwi-description.patch"
    
    # Output file settings
    iso_build_dir: "{{ project_dir }}/output-build"
    iso_file_name: "Fedora.x86_64-{{ target_fedora_version }}.install.iso"
    iso_file_path: "{{ iso_build_dir }}/{{ iso_file_name }}"
    release_iso_file_name: "{{ ansible_facts['date_time'].date }}_{{ iso_file_name }}"
  vars_files:
    - "{{ project_dir }}/inventory/rclone.yml"

  tasks:
    # 1. Clone/fetch, switch branch, and initialize nested submodules
    - name: Ensure kiwi-descriptions is at target version with submodules initialized
      ansible.builtin.git:
        repo: "https://forge.fedoraproject.org/releng/kiwi-descriptions" 
        dest: "{{ kiwi_submodule_path }}"
        version: "f{{ target_fedora_version }}"
        recursive: true
        update: true
        force: true

    # 2. Apply patch
    - name: Apply customizations patch inside kiwi-descriptions
      ansible.posix.patch:
        src: "{{ patch_file_path }}"
        basedir: "{{ kiwi_submodule_path }}"
        strip: 1
        state: present

    # 3. Execute build_all script and build ISO
    - name: Create image and execute build_iso with sudo
      become: true
      become_exe: sudo.ws
      ansible.builtin.shell: "{{ project_dir }}/scripts/build_all.sh"      
      args:
        chdir: "{{ project_dir }}"
        creates: "{{ iso_build_dir }}/{{ iso_file_name }}"

    # 4. Move current release to old folder
    - name: Move current release to old releases folder
      ansible.builtin.command: "rclone move {{ rclone_conf_remote}}:releases/latest {{ rclone_conf_remote}}::releases/old --include='*' --config={{ rclone_conf_path }}"

    # 5. Upload file
    - name: Upload file
      ansible.builtin.command: "rclone copyto {{ iso_file_path }} {{ rclone_conf_remote }}:releases/latest/{{ release_iso_file_name }} --config={{ rclone_conf_path }}"
    
