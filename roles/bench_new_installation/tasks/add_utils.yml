---
- name: Check that utils/dboard exists in the repo
  ansible.builtin.stat:
    path: "{{ bench_dboard_src }}"
  register: dboard_src
  run_once: true
  delegate_to: localhost
  become: false

- name: Fail if utils/dboard is missing
  ansible.builtin.fail:
    msg: >-
      Missing {{ bench_dboard_src }}.
      Place the dboard binary in utils/ before running this playbook.
  when: not dboard_src.stat.exists
  run_once: true

- name: Install dboard into /usr/local/bin
  ansible.builtin.copy:
    src: "{{ bench_dboard_src }}"
    dest: /usr/local/bin/dboard
    owner: root
    group: root
    mode: "0755"
