---
- name: Require git SSH host settings
  ansible.builtin.assert:
    that:
      - bench_repo_name is defined
      - bench_repo_name | length > 0
      - bench_repo_organization is defined
      - bench_repo_organization | length > 0
    fail_msg: >-
      Each bench_git_repos item needs repo_name, repo_organization
      (host {{ inventory_hostname }}, entry {{ bench_repo_name | default('?') }}).

- name: Resolve collaudo home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ bench_collaudo_user }}"

- name: Tempdir to store generated key pair files
  ansible.builtin.tempfile:
    state: directory
    suffix: "{{ bench_repo_name }}"
  register: local_tmpdir
  delegate_to: localhost
  become: false

- name: Generate SSH keypair on the control machine
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -t
      - "{{ bench_ssh_key_type }}"
      - -f
      - "{{ local_tmpdir.path }}/{{ bench_ssh_key_filename }}"
      - -N
      - "{{ bench_repo_checkout_passphrase }}"
      - -C
      - "collaudo@{{ inventory_hostname }}"
    creates: "{{ local_tmpdir.path }}/{{ bench_ssh_key_filename }}"
  delegate_to: localhost
  when: bench_repo_checkout_passphrase | length > 0
  become: false

- name: Read public key from control machine
  ansible.builtin.slurp:
    src: "{{ local_tmpdir.path }}/{{ bench_ssh_key_filename }}.pub"
  register: bench_ssh_pubkey_b64
  delegate_to: localhost
  become: false

- name: Ensure collaudo ~/.ssh directory exists
  ansible.builtin.file:
    path: "/home/{{ bench_collaudo_user }}/.ssh"
    state: directory
    owner: "{{ bench_collaudo_user }}"
    group: "{{ bench_collaudo_user }}"
    mode: "0700"

- name: Install private key for collaudo
  ansible.builtin.copy:
    src: "{{ local_tmpdir.path }}/{{ bench_ssh_key_filename }}"
    dest: "/home/{{ bench_collaudo_user }}/.ssh/{{ bench_ssh_key_filename }}"
    owner: "{{ bench_collaudo_user }}"
    group: "{{ bench_collaudo_user }}"
    mode: "0600"

- name: Install public key for collaudo
  ansible.builtin.copy:
    src: "{{ local_tmpdir.path }}/{{ bench_ssh_key_filename }}.pub"
    dest: "/home/{{ bench_collaudo_user }}/.ssh/{{ bench_ssh_key_filename }}.pub"
    owner: "{{ bench_collaudo_user }}"
    group: "{{ bench_collaudo_user }}"
    mode: "0644"

- name: Add SSH config Host entry for the git repo
  ansible.builtin.blockinfile:
    path: "/home/{{ bench_collaudo_user }}/.ssh/config"
    create: true
    owner: "{{ bench_collaudo_user }}"
    group: "{{ bench_collaudo_user }}"
    mode: "0600"
    marker: "# {mark} ANSIBLE MANAGED BLOCK {{ bench_repo_name }}"
    block: |
      Host {{ bench_repo_name }}
          User {{ bench_repo_username }}
          Hostname {{ bench_repo_hostname }}
          IdentityFile ~/.ssh/{{ bench_ssh_key_filename }}

- name: Ensure checkout parent directory exists
  ansible.builtin.file:
    path: "{{ bench_repo_dest }}"
    state: directory
    owner: "{{ bench_collaudo_user }}"
    group: "{{ bench_collaudo_user }}"
    mode: "0755"

- name: Esegui questa azione solo se la directory è stata appena creata
  ansible.builtin.debug:
    msg: "{{ bench_repo_name }}:{{ bench_repo_organization }}/{{ bench_repo_name }}.git\n {{ bench_repo_dest }}"

- name: Install private key for collaudo
  ansible.builtin.copy:
    content: "{{ bench_ansible_deploy_key_private }}"
    dest: "/home/{{ bench_collaudo_user }}/.ssh/id_ed25519_ansible_deploy_key_private"
    owner: "{{ bench_collaudo_user }}"
    group: "{{ bench_collaudo_user }}"
    mode: "0600"
  no_log: false

- name: Install public key for collaudo
  ansible.builtin.copy:
    content: "{{ bench_ansible_deploy_key_public }}"
    dest: "/home/{{ bench_collaudo_user }}/.ssh/id_ed25519_ansible_deploy_key_public"
    owner: "{{ bench_collaudo_user }}"
    group: "{{ bench_collaudo_user }}"
    mode: "0600"
  no_log: false

- name: Create temp local file with deploy public key
  ansible.builtin.copy:
    content: "{{ bench_ansible_deploy_key_public }}"
    dest: "{{ local_tmpdir.path }}/id_ed25519_ansible_deploy_key_public"
    mode: "0600"
  become: false
  delegate_to: localhost

- name: Upload public key to repository with GitHub CLI
  ansible.builtin.command:
    cmd: "gh repo deploy-key add {{ local_tmpdir.path }}/id_ed25519_ansible_deploy_key_public -R {{ bench_repo_organization }}/{{ bench_repo_name }}"
  become: false
  delegate_to: localhost
  failed_when:
    - gh_deploy_key_add.rc != 0
    - "'already in use' not in gh_deploy_key_add.stderr"

- name: Checkout Repo
  ansible.builtin.git:
    dest: "{{ bench_repo_dest }}"
    repo: "{{ bench_repo_url_for_checkout }}"
    version: "{{ bench_repo_checkout_branch }}"
    accept_hostkey: true
    update: true
    key_file: "/home/{{ bench_collaudo_user }}/.ssh/id_ed25519_ansible_deploy_key_private"
  become: true
  become_user: "{{ bench_collaudo_user }}"
  register: git_checkout

- name: Checkout info
  ansible.builtin.debug:
    msg: "Checkout completed, last commit: {{ git_checkout.after }}, origin={{ bench_repo_origin_url }}"

- name: Set origin remote after checkout
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ bench_repo_dest }}"
      - remote
      - set-url
      - origin
      - "{{ bench_repo_name }}:{{ bench_repo_organization }}/{{ bench_repo_name }}.git"
  become: true
  become_user: "{{ bench_collaudo_user }}"
  changed_when: true
  when: bench_repo_origin_url | length > 0

- name: Retrieve deploy-key id
  ansible.builtin.shell:
    cmd: "gh repo deploy-key list -R {{ bench_repo_organization }}/{{ bench_repo_name }} | grep -i collaudo@{{ inventory_hostname }} | awk -F'\t' '{print $1}'"
  register: deploy_key_id
  become: false
  delegate_to: localhost

- name: Remove deploy key from GitHub
  ansible.builtin.command:
    cmd: "gh repo deploy-key delete {{ deploy_key_id.stdout }} -R {{ bench_repo_organization }}/{{ bench_repo_name }}"
  become: false
  delegate_to: localhost

- name: Upload machine generated public key to repository with GitHub CLI
  ansible.builtin.command:
    cmd: "gh repo deploy-key add {{ local_tmpdir.path }}/{{ bench_ssh_key_filename }}.pub -R {{ bench_repo_organization }}/{{ bench_repo_name }}"
  become: false
  delegate_to: localhost

- name: Remove temporary key file
  ansible.builtin.file:
    path: "/home/collaudo/.ssh/id_ed25519_ansible_deploy_key_private"
    state: absent
  no_log: false
