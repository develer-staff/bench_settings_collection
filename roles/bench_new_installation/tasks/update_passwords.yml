---
- name: Change collaudo password
  ansible.builtin.user:
    name: "{{ bench_collaudo_user }}"
    password: "{{ collaudo_password | password_hash('sha512') }}"

- name: Change develer (sudo) password
  ansible.builtin.user:
    name: "{{ bench_develer_user }}"
    password: "{{ develer_password | password_hash('sha512') }}"

