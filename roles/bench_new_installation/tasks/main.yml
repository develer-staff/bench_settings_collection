---
- name: Set hostname from inventory
  ansible.builtin.include_tasks:
    file: hostname.yml
    apply:
      tags: [hostname]
  tags: [hostname]

- name: Create develer and adjust wheel membership
  ansible.builtin.include_tasks:
    file: users.yml
    apply:
      tags: [users]
  tags: [users]

- name: Install local shell profile and logo
  ansible.builtin.include_tasks:
    file: local_profile.yml
    apply:
      tags: [local_profile]
  tags: [local_profile]

- name: Set desktop and login wallpaper
  ansible.builtin.include_tasks:
    file: wallpaper.yml
    apply:
      tags: [wallpaper]
  tags: [wallpaper]

- name: Install system utils into /usr/local/bin
  ansible.builtin.include_tasks:
    file: add_utils.yml
    apply:
      tags: [utils]
  tags: [utils]

- name: Remove unused LXDE packages
  ansible.builtin.include_tasks:
    file: lxde_cleanup.yml
    apply:
      tags: [lxde_cleanup, packages]
  tags: [lxde_cleanup, packages]

- name: Install base packages
  ansible.builtin.include_tasks:
    file: packages.yml
    apply:
      tags: [packages]
  tags: [packages]

- name: Store secrets in desktop keyring
  ansible.builtin.include_tasks:
    file: keyring.yml
    apply:
      tags: [keyring]
  tags: [keyring]

- name: Install Docker CE
  ansible.builtin.include_tasks:
    file: docker.yml
    apply:
      tags: [docker]
  tags: [docker]

- name: Install Insync
  ansible.builtin.include_tasks:
    file: insync.yml
    apply:
      tags: [insync]
  tags: [insync]

- name: Install Tailscale
  ansible.builtin.include_tasks:
    file: tailscale.yml
    apply:
      tags: [tailscale]
  tags: [tailscale]

- name: Install udev rules
  ansible.builtin.include_tasks:
    file: install_udev.yml
    apply:
      tags: [udev]
  tags: [udev]

- name: Checkout git repositories as collaudo
  ansible.builtin.include_tasks:
    file: checkout_repo.yml
    apply:
      tags: [checkout_repo]
  vars:
    bench_repo_url_for_checkout: "{{item.repo_url_for_checkout}}"
    bench_repo_name: "{{ item.repo_name }}"
    bench_repo_organization: "{{ item.repo_organization }}"
    bench_repo_hostname: "{{ item.repo_hostname | default('github.com') }}"
    bench_repo_username: "{{ item.repo_username | default('git') }}"
    bench_repo_dest: "{{ item.repo_dest | default('/home/collaudo/src/') }}/{{item.repo_name}}"
    bench_repo_checkout_branch: "{{ item.repo_checkout_branch | default('main') }}"
    bench_ssh_key_type: "{{ item.repo_ssh_key_type | default('ed25519') }}"
    bench_ssh_key_filename: "id_{{ item.repo_ssh_key_type | default('ed25519') }}_{{ item.repo_name }}"
    bench_repo_checkout_passphrase: "{{ repo_checkout_passphrase | default(inventory_hostname ~ '-macchia') }}"
    bench_ansible_deploy_key_private: "{{item.ansible_deploy_key_private}}"
    bench_ansible_deploy_key_public: "{{item.ansible_deploy_key_public}}"
    bench_repo_origin_url: "{{ item.repo_origin_url | default(item.repo_username | default('git') ~ '@' ~ item.repo_name ~ ':' ~ item.repo_organization ~ '/' ~ item.repo_name ~ '.git') }}"
  loop: "{{ bench_git_repos }}"
  loop_control:
    label: "{{ inventory_hostname }}::{{ item.repo_organization }}/{{ item.repo_name }}.git"
  tags: [checkout_repo]
