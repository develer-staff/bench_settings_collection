- name: Copy background wallpaper
  ansible.builtin.copy:
    src: "{{ bench_repo_root }}/images/{{bench_wallpaper_src_jxl}}"
    dest: "{{ bench_wallpaper_system_path }}/images/default.jxl"
    mode: '0644'
  become: true

# --- Desktop background (pcmanfm, for user) ---
- name: Create pcmanfn configuration dir
  ansible.builtin.file:
    path: "/home/{{item }}/.config/pcmanfm/LXDE"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0755'
  loop: "{{bench_users}}"

- name: Don't ask user how run destop app shortcut
  ansible.builtin.copy:
    dest: "/home/{{ item }}/.config/pcmanfm/LXDE/desktop-items-0.conf"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0644'
    content: |
      [*]
      wallpaper_mode=crop
      wallpaper=/usr/share/backgrounds/images/default.jxl
      desktop_bg=#000000
      desktop_fg=#ffffff
      desktop_shadow=#000000
      show_wm_menu=0
      sort=mtime;ascending;
      show_documents=0
      show_trash=1
      show_mounts=0
  loop: "{{bench_users}}"

- name: Disable autorun after removable device inserted
  ansible.builtin.copy:
    dest: "/home/{{ item }}/.config/pcmanfm/LXDE/pcmanfm.conf"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0644'
    content: |
      [config]
      bm_open_method=0

      [volume]
      mount_on_startup=1
      mount_removable=1
      autorun=0

      [ui]
      always_show_tabs=0
      max_tab_chars=32
      win_width=640
      win_height=480
      splitter_pos=150
      media_in_new_tab=0
      desktop_folder_new_win=0
      change_tab_on_drop=1
      close_on_unmount=1
      focus_previous=0
      side_pane_mode=places
      view_mode=icon
      show_hidden=0
      sort=name;ascending;
      toolbar=newtab;navigation;home;
      show_statusbar=1
      pathbar_mode_buttons=0
  loop: "{{bench_users}}"
