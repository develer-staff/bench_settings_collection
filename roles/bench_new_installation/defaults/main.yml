---
bench_users:
  - develer
  - collaudo

bench_develer_user: develer
bench_collaudo_user: collaudo

# Repo root (playbooks/ lives one level under the repository root).
bench_repo_root: "{{ playbook_dir | dirname }}"

# Inventory host name (e.g. solaris, pathfinder). Override per-host if needed.
bench_hostname: "{{ inventory_hostname }}"

# Local profile settings
bench_profile_src: "{{ bench_repo_root }}/conf/develer_profile"
bench_logo_src: "{{ bench_repo_root }}/conf/logos/{{inventory_hostname}}.logo"

# Binary utils
bench_dboard_src: "{{ bench_repo_root }}/utils/dboard"

# System configuration
bench_udev_src: "{{ bench_repo_root }}/conf/udev"

## Wallpaper
bench_wallpaper_src: "{{ bench_repo_root }}/images/Devel-background-2.png"
bench_wallpaper_system_dir: /usr/share/backgrounds/devel

bench_base_packages:
  - openssl
  - git
  - git-lfs
  - direnv
  - tmux
  - python3.10
  - python3.10-devel
  - gcc
  - libsecret
  - seahorse
  - gnome-keyring

bench_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

insync_gpg_key_url: https://d2t3ff60b2tol4.cloudfront.net/repomd.xml.key
insync_repo_baseurl: "http://yum.insync.io/fedora/{{ ansible_facts['distribution_major_version'] }}/"

# Git checkouts as collaudo repos and settings are  defined in inventory/host_vars/<host>.yml

